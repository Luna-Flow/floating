name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: moonbit
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout runs `git init`; naming the initial branch keeps git's
      # "default branch name" hint out of the log.
      - name: git initial branch
        run: git config --global init.defaultBranch main

      - name: checkout
        uses: actions/checkout@v7

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: install just
        uses: extractions/setup-just@v4

      - name: update registry
        run: sh tools/run_moon_clean_exec.sh update

      # The verification ledger (`tools/incremental.py`): results of units that passed on a tree
      # that the key describes. Every run restores the newest ledger; only a push to main saves one.
      # GitHub scopes a cache to the ref that created it: a pull-request run reads the caches of
      # the default branch but what it would save belongs to `refs/pull/<n>/merge`, which neither
      # main nor another pull request can restore. So a ledger that a later run trusts is one
      # that a push to main wrote (the restore-only action below cannot save at all). The key is
      # new for every run (the run id), the prefix restores the newest entry. A unit reused from
      # the ledger is printed as REUSED with its commit; 2 % of the reusable units are rerun, and
      # a failing sampled rerun is exit status 70. The toolchain digest is in every key, so a new
      # compiler or runner image reruns everything once.
      - name: restore verification ledger
        uses: actions/cache/restore@v6
        with:
          path: .tmp/verification-ledger
          key: verification-ledger-${{ github.run_id }}
          restore-keys: verification-ledger-

      - name: quick repository gate
        run: just pr

      - name: save verification ledger
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .tmp/verification-ledger
          key: verification-ledger-${{ github.run_id }}-${{ github.run_attempt }}
