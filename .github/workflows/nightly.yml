name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tier the default state of the arm64 job must report from the row primitives of
  # `internal/bin_kernel`: the assembly tier (`asm`) is in, so the default state of an
  # Apple arm64 runner reports `asm`. A build that falls back to the C rows reports `c` and
  # fails this check.
  EXPECTED_DEFAULT_TIER: asm

jobs:
  conformance:
    name: ${{ matrix.scope }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scope:
          - quick
          - decimal
          - decimal_gda
          - binary
          - interval
    steps:
      # actions/checkout runs `git init`; naming the initial branch keeps git's
      # "default branch name" hint out of the log.
      - name: git initial branch
        run: git config --global init.defaultBranch main

      - name: checkout
        uses: actions/checkout@v7

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: install just
        uses: extractions/setup-just@v4

      - name: toolchain
        run: moon version --all

      # Pinned upstream corpora are verified by SHA-256 after download, so the
      # cache only saves bandwidth; the key changes whenever a pin changes.
      - name: cache pinned corpora
        uses: actions/cache@v6
        with:
          path: |
            .tmp/binary-conformance/downloads
            .tmp/binary-conformance/vendor
            testdata/decimal_gda/dectest.zip
            testdata/decimal_gda/dectest0.zip
            testdata/decimal_gda/official
            testdata/decimal_gda/official0
            testdata/interval/*.zip
          key: corpora-${{ hashFiles('testdata/*/corpora.json') }}

      - name: update registry
        run: sh tools/run_moon_clean_exec.sh update

      # No ledger is restored here and `--no-reuse` runs every incremental unit of the quick
      # scope: the nightly gates are the full runs.
      - name: gate
        run: just gate ${{ matrix.scope }} 4 --no-reuse

      - name: upload summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: summaries-${{ matrix.scope }}
          path: .tmp/**/summary.json
          if-no-files-found: ignore
          retention-days: 30

  # The unit tests of the whole workspace on the targets that the pull-request gate only
  # type-checks (`CHECK: other targets`), and the native tests of every package without reuse: the
  # pull-request gate runs those as incremental units (`tools/native_units.py`), so this
  # `native` entry is the audit of them. It is the plain `moon test` of the whole workspace, not
  # a call of that tool, so that it shares nothing with the tool's discovery of packages. The
  # per-target files (`*_js.mbt`, the
  # `*_nonjs` side of every pair, the threshold files) are run here and nowhere else.
  # Measured on main dbc9bc6a on a shared machine: js 29 s, wasm 87 s, wasm-gc 79 s. The
  # pull-request gate does not run them (its budget is about 3 minutes); to run js there,
  # change `QUICK_TEST_TARGETS` in `tools/run_ci.py` to `("js",)`: one line.
  #
  # wasm-gc runs the whole workspace except what needs `moonbitlang/async`: that package
  # has no wasm-gc runtime. Its module initialiser (`internal/coroutine/scheduler.mbt`,
  # 0.22.9) casts between its own `Scheduler` struct and the runtime's with `%identity`,
  # which wasm-gc emits as a plain `ref.as_non_null`, and the runtime rejects the module at
  # validation (`global.set[0] expected type (ref null ..), found ref.as_non_null of type
  # (ref ..)`; it reproduces with that package alone). The benchmark drivers that use it
  # (`tooling/src/bench/*`, `differential`) keep their async tests out of wasm-gc with the
  # `targets` option of their `moon.pkg`, so the plain command below is the whole of what
  # wasm-gc can run. See #544.
  unit-tests:
    name: unit tests ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - native
          - js
          - wasm
          - wasm-gc
    steps:
      - name: git initial branch
        run: git config --global init.defaultBranch main

      - name: checkout
        uses: actions/checkout@v7

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: toolchain
        run: moon version --all

      - name: update registry
        run: sh tools/run_moon_clean_exec.sh update

      # The same two commands as the gate: an unfrozen check fetches the dependencies,
      # the test run is frozen.
      - name: fetch dependencies
        run: sh tools/run_moon_clean_exec.sh check --target native --deny-warn

      - name: test ${{ matrix.target }}
        run: sh tools/run_moon_clean_exec.sh test --target ${{ matrix.target }} --deny-warn --frozen --jobs 4

  # The native row primitives of `internal/bin_kernel` have per-architecture code (Apple
  # arm64 inline assembly in `luna_limbs.c` once it is in). The Linux runner of the other
  # jobs is gcc on x86-64 (`cc_id=2 arch_id=1`), so nothing there executes it: this job
  # runs the tests of `internal/bin_kernel` and `binary` on an arm64 macOS runner in
  # the three states of the primitives, and `tools/check_limbs_tier.py` fails when the
  # runner is not arm64 or when a state reports another tier than it should (the expected
  # tier of the default state is `EXPECTED_DEFAULT_TIER` at the top of this file).
  arm64-native:
    name: arm64 native ${{ matrix.state }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        state:
          - portable # LUNA_FLOATING_PORTABLE=1: the portable loops
          - c # LUNA_FLOATING_LIMBS=c: the C tier
          - default # no variable: the best tier of the build
    steps:
      - name: git initial branch
        run: git config --global init.defaultBranch main

      - name: checkout
        uses: actions/checkout@v7

      - name: runner architecture
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: toolchain
        run: moon version --all

      - name: update registry
        run: sh tools/run_moon_clean_exec.sh update

      - name: fetch dependencies
        run: sh tools/run_moon_clean_exec.sh check --target native --deny-warn

      - name: test internal/bin_kernel and binary (${{ matrix.state }})
        run: |
          set -o pipefail
          case "${{ matrix.state }}" in
            portable) export LUNA_FLOATING_PORTABLE=1 ;;
            c) export LUNA_FLOATING_LIMBS=c ;;
            default) ;;
          esac
          sh tools/run_moon_clean_exec.sh test --target native --deny-warn --frozen --no-parallelize \
            -p Luna-Flow/floating/internal/bin_kernel -p Luna-Flow/floating/binary 2>&1 | tee tier.log

      - name: tier of the row primitives
        run: python3 tools/check_limbs_tier.py --log tier.log --state ${{ matrix.state }} --expected "$EXPECTED_DEFAULT_TIER"

